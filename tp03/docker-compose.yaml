services:
  api:
    build: .
    environment:
      PING_LISTEN_PORT: 3000
    expose:
      - "3000"
    deploy:
      replicas: 4
  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
